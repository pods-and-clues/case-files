site_name: Pods & Clues™
site_description: A narrative-driven Kubernetes training series set inside Zentari Labs
site_url: https://www.podsandclues.com

theme:
  name: material
  custom_dir: docs/overrides
  favicon: assets/homepage/favicon.ico
  features:
    - navigation.tabs
    - navigation.top
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.integrate
  palette:
    - scheme: default
      primary: slate
      accent: custom
  font:
    text: Source Serif 4
    code: JetBrains Mono

nav:
  - Home: index.md
  - Cases:
    - Case 000: cases/case-000.md
  - Copyright: copyright.md

extra_css:
  - css/extra.css

extra_javascript:
  - js/feedback-scroll.js
  - js/home-parallax.js

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - meta
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.snippets

plugins:
  - macros
  - search
  - autorefs
  - minify:
      minify_html: true


